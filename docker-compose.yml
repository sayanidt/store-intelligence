version: '3.8'

services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - DATABASE_URL=sqlite:///data/store_intelligence.db
      - POS_CSV_PATH=/data/pos_transactions.csv
    healthcheck:
      # Use Python's built-in urllib to check health to avoid dependency on curl in slim image
      test: ["CMD-SHELL", "python -c 'import urllib.request, sys; urllib.request.urlopen(\"http://localhost:8000/health\"); sys.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
